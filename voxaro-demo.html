<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voxaro – Chatbot Vorschau</title>
<meta name="robots" content="noindex">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;}
  body{background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center;}
  .box{max-width:560px;}
  h1{font-size:2rem;font-weight:800;color:#fff;margin-bottom:.75rem;letter-spacing:-.02em;}
  h1 span{background:linear-gradient(135deg,#6366f1,#818cf8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  p{color:#94a3b8;line-height:1.7;font-size:1.05rem;}
  .hint{margin-top:2rem;font-size:14px;color:#64748b;border:1px dashed #334155;border-radius:12px;padding:1rem 1.25rem;}
</style>
</head>
<body>
  <div class="box">
    <h1>Voxaro <span>Chatbot</span> – Vorschau</h1>
    <p>So würde der KI-Assistent auf voxaro.ch aussehen. Klick unten rechts auf das Chat-Symbol und stell ihm eine Frage.</p>
    <div class="hint">Diese Seite dient nur zur Vorschau. Auf der echten Website erscheint der Assistent als schwebendes Chat-Fenster – das Design passt sich an.</div>
  </div>
  <script src="/voxaro-widget.js" defer></script>
</body>
</html>
