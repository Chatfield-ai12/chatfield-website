<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatfield – KI-Assistent</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f5f4f0; --navy: #0d1f35; --navy-mid: #1a3550;
  --blue: #2461d4; --blue-soft: #e8f0fc; --white: #fff;
  --gray-1: #f8f8f6; --gray-2: #eeede9; --gray-3: #d4d2cc;
  --gray-5: #6b6860; --gray-8: #2a2926; --green: #22c55e; --red: #ef4444;
}
body { font-family: 'Inter', sans-serif; background: var(--bg); min-height: 100vh; }
.widget { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.panel { width: 370px; border-radius: 18px; overflow: hidden; box-shadow: 0 12px 48px rgba(13,31,53,.18); display: none; flex-direction: column; background: var(--white); border: 1px solid var(--gray-2); max-height: 600px; }
.panel.open { display: flex; }
.head { background: var(--navy); padding: 14px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.head-logo { width: 38px; height: 38px; border-radius: 10px; background: var(--blue); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.head-logo svg { width: 19px; height: 19px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.head-title { font-size: 14px; font-weight: 600; color: var(--white); letter-spacing: -.2px; }
.head-sub { font-size: 11px; color: rgba(255,255,255,.5); margin-top: 1px; display: flex; align-items: center; gap: 4px; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
.head-close { margin-left: auto; background: rgba(255,255,255,.08); border: none; color: rgba(255,255,255,.6); cursor: pointer; width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; transition: background .15s; }
.head-close:hover { background: rgba(255,255,255,.15); color: var(--white); }
.msgs { flex: 1; padding: 14px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background: var(--gray-1); min-height: 280px; max-height: 340px; }
.msgs::-webkit-scrollbar { width: 3px; }
.msgs::-webkit-scrollbar-thumb { background: var(--gray-3); border-radius: 2px; }
.row-bot { display: flex; align-items: flex-end; gap: 6px; align-self: flex-start; max-width: 90%; }
.row-user { align-self: flex-end; max-width: 88%; }
.avatar { width: 26px; height: 26px; border-radius: 8px; background: var(--blue); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-bottom: 2px; }
.avatar svg { width: 13px; height: 13px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.bubble-bot { background: var(--white); border: 1px solid var(--gray-2); border-radius: 4px 14px 14px 14px; padding: 10px 13px; font-size: 13.5px; line-height: 1.6; color: var(--gray-8); }
.bubble-user { background: var(--navy); color: var(--white); border-radius: 14px 4px 14px 14px; padding: 10px 13px; font-size: 13.5px; line-height: 1.6; }
.msg-time { font-size: 10px; color: var(--gray-5); margin-top: 3px; padding: 0 2px; }
.row-user .msg-time { text-align: right; }
.typing-wrap { display: flex; gap: 4px; padding: 4px 2px; align-items: center; }
.typing-wrap span { width: 5px; height: 5px; border-radius: 50%; background: var(--gray-3); animation: pulse 1.2s infinite; }
.typing-wrap span:nth-child(2) { animation-delay: .2s; }
.typing-wrap span:nth-child(3) { animation-delay: .4s; }
@keyframes pulse { 0%,60%,100%{transform:translateY(0);opacity:.35} 30%{transform:translateY(-5px);opacity:1} }
.quick { padding: 8px 12px; display: flex; gap: 5px; flex-wrap: wrap; background: var(--white); border-top: 1px solid var(--gray-2); flex-shrink: 0; }
.qbtn { font-size: 11.5px; padding: 5px 11px; border: 1px solid var(--gray-2); border-radius: 16px; background: var(--gray-1); color: var(--gray-5); cursor: pointer; font-family: 'Inter', sans-serif; transition: all .15s; white-space: nowrap; }
.qbtn:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-soft); }
.inp-row { display: flex; gap: 7px; padding: 10px 12px; background: var(--white); border-top: 1px solid var(--gray-2); flex-shrink: 0; }
.inp { flex: 1; padding: 9px 13px; border: 1px solid var(--gray-2); border-radius: 18px; background: var(--gray-1); font-size: 13px; font-family: 'Inter', sans-serif; color: var(--gray-8); outline: none; transition: border-color .15s; }
.inp::placeholder { color: var(--gray-3); }
.inp:focus { border-color: var(--blue); background: var(--white); }
.send { width: 34px; height: 34px; border-radius: 50%; background: var(--navy); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background .15s; }
.send:hover { background: var(--navy-mid); }
.send svg { width: 14px; height: 14px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.panel-foot { padding: 6px; text-align: center; font-size: 10.5px; color: var(--gray-3); background: var(--white); border-top: 1px solid var(--gray-2); }
.panel-foot a { color: var(--blue); text-decoration: none; }
.fab-wrap { position: relative; }
.fab { width: 54px; height: 54px; border-radius: 50%; background: var(--navy); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(13,31,53,.28); transition: all .2s; }
.fab:hover { background: var(--navy-mid); transform: scale(1.05); }
.fab svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.notif { position: absolute; top: -3px; right: -3px; width: 18px; height: 18px; border-radius: 50%; background: var(--red); color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg); }
@media (max-width: 420px) { .panel { width: calc(100vw - 2rem); } .widget { right: 1rem; bottom: 1rem; } }
</style>
</head>
<body>

<div class="widget">
  <div class="panel" id="panel">
    <div class="head">
      <div class="head-logo"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
      <div style="flex:1">
        <div class="head-title">Chatfield Assistent</div>
        <div class="head-sub"><span class="status-dot"></span> Online</div>
      </div>
      <button class="head-close" onclick="toggle()" aria-label="Schliessen">&#10005;</button>
    </div>

    <div class="msgs" id="msgs">
      <div class="row-bot">
        <div class="avatar"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
        <div>
          <div class="bubble-bot">Guten Tag. Ich bin der Assistent von Chatfield. Ich beantworte Fragen zu unseren KI-Assistenten f&uuml;r Schweizer Unternehmen. Was m&ouml;chten Sie wissen?</div>
          <div class="msg-time">Jetzt</div>
        </div>
      </div>
    </div>

    <div class="quick">
      <button class="qbtn" onclick="q('Was macht Chatfield genau?')">Was ist Chatfield</button>
      <button class="qbtn" onclick="q('Was kostet das?')">Preise</button>
      <button class="qbtn" onclick="q('Wie funktioniert die Integration auf meiner Website?')">Integration</button>
      <button class="qbtn" onclick="q('Was ist das Pilot-Programm?')">Gratis testen</button>
      <button class="qbtn" onclick="q('F&uuml;r welche Branchen eignet sich das?')">Branchen</button>
      <button class="qbtn" onclick="q('Wie sieht es mit Datenschutz aus?')">Datenschutz</button>
      <button class="qbtn" onclick="q('Wie schnell ist der Bot live?')">Ablauf</button>
      <button class="qbtn" onclick="q('Wer steckt hinter Chatfield?')">&Uuml;ber uns</button>
    </div>

    <div class="inp-row">
      <input class="inp" id="inp" type="text" placeholder="Ihre Frage..." onkeydown="if(event.key==='Enter')send()" />
      <button class="send" onclick="send()" aria-label="Senden">
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
    <div class="panel-foot">Powered by <a href="https://chatfield-ai.ch" target="_blank">chatfield-ai.ch</a></div>
  </div>

  <div class="fab-wrap">
    <button class="fab" id="fab" onclick="toggle()" aria-label="Chat oeffnen">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </button>
    <div class="notif" id="notif">1</div>
  </div>
</div>

<script>
let history = [], busy = false, open = false;
const msgsEl = document.getElementById('msgs');
const panelEl = document.getElementById('panel');
const BOT_SVG = '<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';

function toggle() {
  open = !open;
  panelEl.className = 'panel' + (open ? ' open' : '');
  document.getElementById('notif').style.display = open ? 'none' : 'flex';
  document.getElementById('fab').innerHTML = open
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
    : BOT_SVG;
}

function time() { return new Date().toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' }); }

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }

function addMsg(text, role) {
  const d = document.createElement('div');
  if (role === 'bot') {
    d.className = 'row-bot';
    d.innerHTML = '<div class="avatar">' + BOT_SVG + '</div><div><div class="bubble-bot">' + esc(text) + '</div><div class="msg-time">' + time() + '</div></div>';
  } else {
    d.className = 'row-user';
    d.innerHTML = '<div><div class="bubble-user">' + esc(text) + '</div><div class="msg-time">' + time() + '</div></div>';
  }
  msgsEl.appendChild(d);
  msgsEl.scrollTop = msgsEl.scrollHeight;
  return d;
}

function showTyping() {
  const d = document.createElement('div');
  d.className = 'row-bot'; d.id = 'typing';
  d.innerHTML = '<div class="avatar">' + BOT_SVG + '</div><div><div class="bubble-bot"><div class="typing-wrap"><span></span><span></span><span></span></div></div></div>';
  msgsEl.appendChild(d);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function q(text) { if (!open) toggle(); document.getElementById('inp').value = text; send(); }

async function send() {
  if (busy) return;
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = ''; busy = true;
  if (!open) toggle();
  addMsg(text, 'user');
  history.push({ role: 'user', content: text });
  if (history.length > 12) history = history.slice(-12);
  showTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });

    if (!res.ok) throw new Error('bad response');

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let full = '', bubble = null, buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const p = line.slice(6).trim();
        if (p === '[DONE]') continue;
        let ev;
        try { ev = JSON.parse(p); } catch(e) { continue; }
        if (ev.type === 'content_block_delta' && ev.delta && ev.delta.text) {
          if (!bubble) {
            const t = document.getElementById('typing');
            if (t) t.remove();
            bubble = addMsg('', 'bot').querySelector('.bubble-bot');
          }
          full += ev.delta.text;
          bubble.innerHTML = esc(full);
          msgsEl.scrollTop = msgsEl.scrollHeight;
        }
      }
    }

    const t = document.getElementById('typing');
    if (t) t.remove();
    if (!full) addMsg('Entschuldigung, bitte versuchen Sie es erneut.', 'bot');
    else history.push({ role: 'assistant', content: full });

  } catch(e) {
    const t = document.getElementById('typing');
    if (t) t.remove();
    addMsg('Verbindungsfehler. Bitte versuchen Sie es erneut oder schreiben Sie an lev@chatfield-ai.ch', 'bot');
  }
  busy = false;
}
</script>
</body>
</html>
